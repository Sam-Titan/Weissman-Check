[project]
name = "weissman-check"
version = "0.1.0"
description = "Which compressor should you ship? Real benchmarks, explained."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "brotli>=1.1",
    "zstandard>=0.23",
    "lz4>=4.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
